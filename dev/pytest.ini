[pytest]
# The repository root is the plugin package (it has __init__.py): import test
# modules by path, not by walking up into it. conftest.py loads the plugin.
# Run from dev/.
# test_prompt_refinement_plugin.py needs a Hermes checkout: scripts/test-in-hermes.sh.
addopts = -p no:cacheprovider --import-mode=importlib --ignore=test/python/test_prompt_refinement_plugin.py
testpaths = test/python
